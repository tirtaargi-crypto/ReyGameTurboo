name: Build ReyGameTurbo RGT from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # Do not enable setup-java's Gradle cache here.
          # The Android project is intentionally extracted from the ZIP after checkout,
          # so setup-java cannot see gradle-wrapper.properties at cache-key time.

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -name '*.zip' -print)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo 'ERROR: No project ZIP found in repository root.' >&2
            exit 1
          fi
          if [ "${#zips[@]}" -gt 1 ]; then
            echo 'ERROR: More than one ZIP found in repository root:' >&2
            printf ' - %s\n' "${zips[@]}" >&2
            exit 1
          fi
          ZIP="${zips[0]}"
          rm -rf "$RUNNER_TEMP/rgt-extracted"
          mkdir -p "$RUNNER_TEMP/rgt-extracted"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/rgt-extracted"
          echo "Extracted $ZIP"

      - name: Locate Android Gradle root
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rgt-extracted"
          mapfile -t settings < <(find "$ROOT" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print)
          if [ "${#settings[@]}" -eq 0 ]; then
            echo 'ERROR: settings.gradle.kts/settings.gradle not found inside ZIP.' >&2
            exit 1
          fi
          if [ "${#settings[@]}" -gt 1 ]; then
            echo 'ERROR: Multiple Gradle roots found inside ZIP:' >&2
            printf ' - %s\n' "${settings[@]}" >&2
            exit 1
          fi
          PROJECT_ROOT="$(dirname "${settings[0]}")"
          if [ ! -d "$PROJECT_ROOT/app" ]; then
            echo "ERROR: Android app module not found at $PROJECT_ROOT/app" >&2
            exit 1
          fi
          if [ ! -f "$PROJECT_ROOT/app/build.gradle.kts" ] && [ ! -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle(.kts) not found." >&2
            exit 1
          fi
          if [ ! -f "$PROJECT_ROOT/gradlew" ]; then
            echo 'ERROR: gradlew is missing from the Gradle root.' >&2
            exit 1
          fi
          chmod +x "$PROJECT_ROOT/gradlew"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Gradle root: $PROJECT_ROOT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ steps.locate.outputs.project_root }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo 'ERROR: Gradle finished but no APK was created.' >&2
            exit 1
          fi
          printf 'APK: %s\n' "${apks[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReyGameTurbo-RGT-debug-apk
          path: ${{ steps.locate.outputs.project_root }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

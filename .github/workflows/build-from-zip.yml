name: Build ReyGameTurbo RGT from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name "*.zip")

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "::error::No project ZIP found in repository root."
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "::error::More than one ZIP found."
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "Using: ${ZIPS[0]}"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          rm -rf "$RUNNER_TEMP/rgt-extracted"
          mkdir -p "$RUNNER_TEMP/rgt-extracted"

          unzip -q "${ZIPS[0]}" -d "$RUNNER_TEMP/rgt-extracted"

          echo "Extracted project:"
          find "$RUNNER_TEMP/rgt-extracted" -maxdepth 3 -type f | head -100

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_ROOT=$(find "$RUNNER_TEMP/rgt-extracted" \
            -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::No Gradle settings file found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_ROOT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_ROOT }}
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_ROOT/app/build/outputs/apk/debug" \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReyGameTurbo-RGT-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
